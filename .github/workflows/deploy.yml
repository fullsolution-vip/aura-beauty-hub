name: Deploy to Cloudflare Pages

# Live site: https://aura-beauty-hub.pages.dev

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Cloudflare Pages project
        run: |
          echo "=== Creating Cloudflare Pages Project ==="
          curl -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "aura-beauty-hub",
              "build_config": {
                "build_command": "npm run build",
                "destination_dir": "dist/client"
              },
              "source": {
                "type": "deploy_directive"
              }
            }'
          echo ""

      - name: Deploy to Cloudflare Pages
        run: |
          echo "=== Deploying to Cloudflare Pages ==="
          curl -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/aura-beauty-hub/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: multipart/form-data" \
            -F "manifest=@dist/client/_routes.json" \
            -F "assets=@dist/client" 2>/dev/null || echo "Trying alternative upload method..."
          echo ""
          echo "=== Checking deployments ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/aura-beauty-hub/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | head -50
