name: Deploy to GitHub Pages

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          # Create index.html for SPA fallback
          cat > dist/client/index.html << 'INDX'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Aura Beauty Hub</title>
              <meta name="description" content="Premium beauty and skincare products" />
              <base href="/aura-beauty-hub/" />
              <link rel="icon" type="image/svg+xml" href="assets/flask-conical-BIAyPJV7.js" />
              <link rel="stylesheet" href="assets/styles-DPqdsFEz.css" />
            </head>
            <body>
              <div id="root">Loading...</div>
              <script type="module" src="assets/index-DZ0tBDi8.js"></script>
            </body>
          </html>
          INDX

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
