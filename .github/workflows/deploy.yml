name: Deploy to GitHub Pages

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build

          # Find the actual hashed filenames
          MAIN_JS=$(ls dist/client/assets/index-*.js | grep -v 'index-C' | head -1)
          CSS_FILE=$(ls dist/client/assets/styles-*.css | head -1)
          ICON_FILE=$(ls dist/client/assets/flask-conical-*.js | head -1)

          echo "Main JS: $MAIN_JS"
          echo "CSS: $CSS_FILE"
          echo "Icon: $ICON_FILE"

          # Extract just the filenames
          MAIN_JS_NAME=$(basename "$MAIN_JS")
          CSS_NAME=$(basename "$CSS_FILE")
          ICON_NAME=$(basename "$ICON_FILE")

          # Create index.html using actual filenames
          cat > dist/client/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Aura Beauty Hub</title>
              <meta name="description" content="Premium beauty and skincare products" />
              <base href="/aura-beauty-hub/" />
              <link rel="icon" type="image/svg+xml" href="assets/$ICON_NAME" />
              <link rel="stylesheet" href="assets/$CSS_NAME" />
            </head>
            <body>
              <div id="root">Loading...</div>
              <script type="module" src="assets/$MAIN_JS_NAME"></script>
            </body>
          </html>
          EOF

          # Copy to 404.html
          cp dist/client/index.html dist/client/404.html

          # List what we created
          echo "=== Build output ==="
          ls -la dist/client/index.html
          ls -la dist/client/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
