name: Deploy to GitHub Pages

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          # Create index.html for SPA fallback
          cat > dist/client/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Aura Beauty Hub</title>
              <meta name="description" content="Premium beauty and skincare products" />
              <base href="/aura-beauty-hub/" />
              <link rel="icon" type="image/svg+xml" href="assets/flask-conical-BIAyPJV7.js" />
              <link rel="stylesheet" href="assets/styles-DPqdsFEz.css" />
            </head>
            <body>
              <div id="root">Loading...</div>
              <script type="module" src="assets/index-DZ0tBDi8.js"></script>
            </body>
          </html>
          EOF
          # Copy to 404.html
          cp dist/client/index.html dist/client/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./preview

      - name: Verify build output
        run: |
          echo "=== Verifying build output ==="
          ls -la ./preview/
          echo ""
          echo "=== Checking key files ==="
          test -f ./preview/index.html && echo "✓ index.html exists" || echo "✗ index.html MISSING"
          test -f ./preview/assets/index-DZ0tBDi8.js && echo "✓ Main JS exists" || echo "✗ Main JS MISSING"
          test -f ./preview/assets/styles-DPqdsFEz.css && echo "✓ CSS exists" || echo "✗ CSS MISSING"
          echo ""
          echo "=== index.html content ==="
          head -20 ./preview/index.html

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
