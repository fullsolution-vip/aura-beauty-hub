name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug token
        run: |
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "Token prefix: ${CLOUDFLARE_API_TOKEN:0:10}..."
          echo "Token suffix: ...${CLOUDFLARE_API_TOKEN: -5}"
          echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"

      - name: Test API
        run: |
          echo "=== Testing token verification ==="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json"
          echo ""
          echo "=== Testing accounts API ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
